name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Üretilen protobuf kodu depoya konmuyor (.gitignore: *.pb.go), bu yüzden
# HER iş önce `buf generate` çalıştırmak zorunda. Ortak adımlar bir bileşik
# eyleme (.github/actions/setup) çıkarıldı.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ⚠ YAMA SÜRÜMÜ DAHİL sabitleniyor, "1.25" değil.
  #
  # Gerekçe ölçülerek öğrenildi: govulncheck üç stdlib zafiyeti bildirdi
  # (net/url, crypto/tls, encoding/asn1 — hepsi go1.25.13'te düzeltilmiş)
  # ve koşu go1.25.12 ile yapılmıştı. "1.25" yazmak setup-go'nun o anki
  # sürüm listesine güvenmek demek; liste bayatladığında yamalı sürüm
  # sessizce ALINMAZ ve güvenlik işi, kendi denetlediği şeyin eski hâlini
  # denetler.
  #
  # Bunu yükseltmek artık bilinçli bir hamle: govulncheck kırmızıya
  # döndüğünde önce buraya bakılacak.
  GO_VERSION: "1.25.13"
  BUF_VERSION: "1.47.2"

jobs:
  lint:
    name: Biçim ve statik analiz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          go-version: ${{ env.GO_VERSION }}
          buf-version: ${{ env.BUF_VERSION }}

      - name: buf lint
        run: buf lint

      - name: gofmt
        run: |
          unformatted="$(gofmt -l ./cmd ./internal ./tools)"
          if [[ -n "$unformatted" ]]; then
            echo "Biçimlendirilmemiş dosyalar:" >&2
            echo "$unformatted" >&2
            echo "Düzeltmek için: gofmt -w ./cmd ./internal ./tools" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Kabuk betiklerinin SÖZDİZİMİ. Hiçbir test betiklerin çoğunu
      # koşturmuyor; `kadran-offsite.sh` gibi bir betik yalnızca sunucuda,
      # zamanlayıcıyla koşar. Bozuk bir sözdizimi orada ilk kez görülür ve
      # birim her gece sessizce `failed` kalırdı. K-101'de tam olarak bu
      # oldu: `${VAR:?…}` içindeki bir kesme işareti betiğin tamamını
      # bozdu ve yalnızca canlı sunucuda koşunca fark edildi.
      - name: Kabuk betiklerinin sözdizimi (bash -n)
        run: |
          bozuk=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "::error file=$f::bash -n başarısız" >&2; bozuk=1; }
          done < <(git ls-files '*.sh')
          exit "$bozuk"

      # Alarm göndericisinin biçimlendiricisi (K-108). Girdiler kadrand'nin
      # journal'ına gerçekten düşen satırların biçiminde; ağa dokunmaz.
      - name: Alarm mesajı biçimlendiricisi
        run: bash scripts/check-notify-format.sh

      # Hacim arşivleyicisi ve uzak yükleyici (K-111). rclone ve age sahte,
      # tar ve zstd gerçek. ROOT ile: iki betik de yapılandırmanın ve üst
      # dizinlerinin root'a ait olmasını şart koşuyor; testi geçsin diye o
      # denetime kaçış kapısı açılmadı.
      - name: Hacim yedeği ve uzak yükleyici
        run: sudo bash scripts/check-offsite.sh

      # Kurulum betiğinin yardımcıları set -euo pipefail altında GERÇEKTEN
      # çalıştırılıyor (K-112): metin okuyan Go testleri, eksik dosyada
      # kurulumu sessizce durduran bir boru hattını göremez.
      - name: Kurulum betiği yardımcıları
        run: bash scripts/check-install-sh.sh

      # authorized_keys ve .ssh kadran-client olarak yazılıyor (K-139).
      # Bunu ölçen bölüm gerçek bir kullanıcı ve setpriv ister; root'suz
      # koşu onu atlıyor. Burada ZORUNLU: root yoksa adım kırmızı.
      - name: Kurulum betiği yardımcıları (root)
        run: sudo env KADRAN_TEST_REQUIRE_ROOT=1 bash scripts/check-install-sh.sh

      # panely → kadran göçünün dosya adımları (K-136): taşıma, önek,
      # authorized_keys, rclone hedefi. Sahte kökte, root'suz. Kullanıcı
      # adlandırma ve birimler gerçek sunucuda ölçüldü (GCP provası).
      - name: Göç betiği (panely → kadran)
        run: bash scripts/check-goc-sh.sh

      # Dış nabız Worker'ı (K-109): karar mantığı ve Worker, sahte KV ve
      # sahte fetch ile. Bağımlılık yok, yalnızca node:test.
      - name: Dış nabız Worker'ı
        working-directory: deploy/nabiz
        run: node --test karar.test.js worker.test.js

      # # Sürüm sabiti neden hem action'ı hem linter'ı kapsıyor?
      #
      # action v6 YALNIZCA golangci-lint v1, v7+ YALNIZCA v2 destekliyor.
      # Yani linter sürümünü değiştirmek action'ın ana sürümünü de
      # değiştirmek demek; ikisi birlikte hareket etmek zorunda.
      # .golangci.yml de v2 şemasında — üçü tek bir küme.
      #
      # v1.62 neden bırakıldı: yayınlanmış binary'si go1.23 ile derlenmiş
      # ve golangci-lint kendi Go sürümünü go.mod'un hedefinden (1.25.0)
      # küçük bulunca yapılandırmayı okumadan çıkıyor. Yerelde sorun
      # görünmüyordu çünkü yerel kurulum `go install` ile, yani yerel
      # araç zinciriyle derlenmişti. v2.12.2'nin linux-amd64 artefaktının
      # go1.26.2 ile derlendiği indirilip doğrulandı.
      #
      # Bu adım setup'tan SONRA gelmek zorunda: üretilen protobuf kodu
      # olmadan tip denetimi yapılamaz ve linter anlamsız hatalar verir.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  test:
    name: Testler (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux üretim hedefi; Windows geliştirme iş istasyonu. İkisi de
        # kırılmamalı — güvenlik testlerinin bir kısmı yalnızca Linux'ta
        # KOŞUYOR (SO_PEERCRED, unix soketi), ama hepsi ikisinde de DERLENİYOR.
        #
        # ubuntu-24.04-arm GERÇEK arm64 donanımıdır ve emülasyon değildir.
        #
        # Neden önemli: arm64 uzun süre yalnızca ÇAPRAZ DERLENİYORDU, hiç
        # KOŞTURULMUYORDU. "Derleniyor" ile "çalışıyor" arasındaki fark,
        # bu projede tekrar tekrar gerçek hata çıkardı — SO_PEERCRED
        # testleri de Windows'ta derlenip koşmadığı için bir dönem boşluk
        # bırakmıştı. Hizalama, atomik işlemler ve syscall davranışı
        # mimariye göre değişir; derleyici bunları yakalamaz.
        #
        # Bu runner PUBLIC depolarda ücretsiz. Hetzner'de ARM (cax*)
        # kapasitesi nbg1/fsn1/hel1'in üçünde de yoktu, yani gerçek ARM'a
        # erişimin tek yolu buydu (docs/decisions.md K-037).
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          go-version: ${{ env.GO_VERSION }}
          buf-version: ${{ env.BUF_VERSION }}

      # Kasanın geri dönüş betiği (K-123) gerçek sqlite3 ve age ile sınanıyor;
      # Linux'ta değişken set olduğu için araç eksikse test atlanmıyor, düşüyor.
      - name: Kasa geri dönüş araçları
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3 age

      - name: go test -race
        # Linux runner'larında parolasız sudo var: bootstrap'ın sudo kipi
        # gerçek `sudo -n` ile koşuyor (TestRealScriptsInstallUnderSudo,
        # K-127). Değişken set iken test atlanmıyor; sudo yoksa düşüyor.
        env:
          KADRAN_TEST_REAL_SUDO: ${{ runner.os == 'Linux' && '1' || '' }}
          KADRAN_TEST_REQUIRE_KASA_TOOLS: ${{ runner.os == 'Linux' && '1' || '' }}
        run: go test -race -count=1 ./...

  build:
    name: Derleme (linux/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          go-version: ${{ env.GO_VERSION }}
          buf-version: ${{ env.BUF_VERSION }}

      # arm64 desteği iddia değil, gereklilik: Hetzner'ın ARM sunucuları
      # (CAX serisi) belirgin biçimde ucuz. SQLite sürücüsü CGO'suz
      # (modernc.org/sqlite) seçildiği için çapraz derleme sade kalıyor.
      - name: Binary'leri derle
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME}"
          # Modül yolu go.mod'dan: elle yazılan yanlış bir -X yolu HATASIZ
          # yok sayılır ve ikili "dev" der (K-130).
          mod="$(go list -m)"
          ldflags="-s -w"
          ldflags="$ldflags -X $mod/internal/version.Version=$version"
          ldflags="$ldflags -X $mod/internal/version.Commit=${GITHUB_SHA::12}"
          for binary in kadrand kadran-exec kadran-connect kadran-vault kadran; do
            go build -trimpath -ldflags "$ldflags" -o "dist/$binary" "./cmd/$binary"
          done
          ls -la dist/

      # kadran-caddy AYRI bir Go modülü (build/caddy/go.mod), yani
      # `go build ./...` onu KAPSAMAZ ve kök modülün testleri de görmez.
      # Ayrı derlenmezse sessizce çürür: Caddy'nin modül yolları sürüm
      # atlarında değişebiliyor ve arıza ancak sunucuda kurulum sırasında
      # görülürdü.
      #
      # ⚠ Bu binary bir GÜVENLİK SINIRI taşıyor: dosya servis eden
      # modüller kasten dışarıda (docs/decisions.md K-050). Derlemenin
      # CI'da koşması, o sınırın hâlâ derlenebilir olduğunu garanti eder;
      # sınırın hâlâ ETKİLİ olduğu ise sunucuda ölçülüyor.
      - name: Ters vekili derle (ayrı modül)
        run: |
          bash scripts/build-caddy.sh "${{ matrix.arch }}" "$PWD/dist/kadran-caddy"
          ls -la dist/kadran-caddy

      # Kurulum betiği ters vekili yalnızca ikili değişince yeniden
      # başlatıyor. İkiliye commit gömülürse Caddy'ye dokunmayan her
      # yükseltme de trafiği keser (K-112, ölçüldü). Pozitif kontrol:
      # derleme bilgisi okunamazsa "vcs yok" hiçbir şey kanıtlamaz.
      - name: Ters vekil ikilisi commit'ten bağımsız mı
        run: |
          info="$(go version -m dist/kadran-caddy)"
          if ! grep -q 'github.com/erkanrzgc/kadran/build/caddy' <<<"$info"; then
            echo "ölçüm geçersiz: kadran-caddy'nin derleme bilgisi okunamadı"; exit 1
          fi
          if grep -q 'vcs\.revision' <<<"$info"; then
            echo "kadran-caddy commit bilgisi taşıyor: her yükseltme ters vekili yeniden başlatır (K-112)"
            exit 1
          fi
          # Build ID kaynak baytlarının özeti: satır sonu ya da yorum farkı
          # bile ikiliyi değiştirir. Boş olmalı (scripts/build-caddy.sh).
          bid="$(go tool buildid dist/kadran-caddy)"
          if [ -n "$bid" ]; then
            echo "kadran-caddy build ID taşıyor ($bid): ikili kaynak baytlarına bağlı (K-112)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: kadran-linux-${{ matrix.arch }}
          path: dist/
          retention-days: 14

  # Yayın paketleme betiği HER push'ta uçtan uca koşuyor (K-132): yalnız
  # yayın gününde koşan bir betik, bozulduğunu da o gün söylerdi. Paketin
  # lisans dosyalarını gerçekten taşıdığı tar'ın İÇİNDEN okunuyor.
  package:
    name: Yayın paketi (lisanslar dahil)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          go-version: ${{ env.GO_VERSION }}
          buf-version: ${{ env.BUF_VERSION }}

      - name: Paketle
        run: bash scripts/package-release.sh "$RUNNER_TEMP/rel" "ci-${GITHUB_SHA::12}"

      - name: Paketin içeriği
        working-directory: ${{ runner.temp }}/rel
        run: |
          sha256sum -c --quiet SHA256SUMS
          for arch in amd64 arm64; do
            t="kadran-server-ci-${GITHUB_SHA::12}-linux-$arch.tar.gz"
            listed="$(tar -tzf "$t" | sort)"
            for f in LICENSE NOTICE THIRD_PARTY_LICENSES.txt \
                     "bin/linux-$arch/kadrand" "bin/linux-$arch/kadran-exec" \
                     "bin/linux-$arch/kadran-connect" "bin/linux-$arch/kadran-caddy" \
                     "bin/linux-$arch/kadran-vault"; do
              grep -qxF "$f" <<<"$listed" || { echo "::error::$t içinde $f yok" >&2; exit 1; }
            done
            # Tar'daki lisans dosyası boş ya da yanlış olmamalı: içinden oku.
            tar -xzOf "$t" THIRD_PARTY_LICENSES.txt | grep -q '^github.com/caddyserver/caddy/v2 ' \
              || { echo "::error::$t lisans dosyası Caddy'yi içermiyor" >&2; exit 1; }
            tar -xzOf "$t" LICENSE | grep -q 'Apache License' \
              || { echo "::error::$t LICENSE Apache-2.0 değil" >&2; exit 1; }
          done
          for p in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64.exe; do
            test -s "kadran-ci-${GITHUB_SHA::12}-$p" || { echo "::error::kadran-$p yok" >&2; exit 1; }
          done
          ls -la

  e2e:
    name: Uçtan uca (gerçek kadrand)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          go-version: ${{ env.GO_VERSION }}
          buf-version: ${{ env.BUF_VERSION }}

      # Birim testleri istemciyi SAHTE bir sunucuya karşı sınıyor. Sahte
      # sunucu SO_PEERCRED doğrulaması yapmıyor ve kimlik önsözünü okumuyor;
      # K-012'deki hata tam olarak bu boşlukta yaşadı. Burada gerçek kadrand
      # başlatılıp gerçek kadran ile konuşuluyor.
      - name: Binary'leri derle
        run: |
          mkdir -p bin/linux
          go build -o bin/linux/kadrand ./cmd/kadrand
          go build -o bin/linux/kadran ./cmd/kadran
          go build -o bin/linux/kadran-connect ./cmd/kadran-connect
          go build -o bin/linux/kadran-vault ./cmd/kadran-vault

      - name: E2E CLI kontrolleri
        run: bash scripts/e2e-cli-runner.sh bin/linux

      # ── Askıda kalma tespiti GERÇEK systemd altında (K-115) ─────────
      #
      # Birim testleri pingin NE ZAMAN atıldığını sınıyor; systemd'nin
      # WATCHDOG_USEC'i gerçekten verdiğini, pingleri aldığını ve ping
      # kesilince öldürüp geri getirdiğini ancak gerçek PID 1 gösterir.
      # Runner'da systemd PID 1. Kontrol grupları betiğin başında.
      - name: Watchdog (gerçek systemd)
        run: sudo bash scripts/e2e-watchdog.sh "$PWD/bin/linux"

      # ── Docker sürücüsü GERÇEK daemon'a karşı ──────────────────────
      #
      # Birim testleri SAHTE bir daemon'a konuşuyor ve sahte daemon,
      # gövdeyi Docker'ın gerçekten kabul edip etmediğini bilmez. Bu
      # projede "derleniyor" ile "çalışıyor" farkı defalarca gerçek hata
      # çıkardı; ubuntu runner'ında Docker zaten kurulu, bedava.
      #
      # Hacim kökü BURADA sertleştiriliyor, çünkü sertleştirilmemişse
      # ilgili test SKIP eder — ve sessizce atlanan bir güvenlik testi
      # yeşil rozetten başka bir şey üretmez.
      - name: Hacim kökünü sertleştir (nodev,nosuid)
        run: |
          sudo mkdir -p /var/lib/kadran/volumes
          sudo mount -o bind,nodev,nosuid /var/lib/kadran/volumes /var/lib/kadran/volumes
          opts="$(awk '$5=="/var/lib/kadran/volumes"{print $6}' /proc/self/mountinfo | head -1)"
          echo "etkin: $opts"
          for f in nodev nosuid; do
            printf '%s' "$opts" | tr ',' '\n' | grep -qx "$f" \
              || { echo "::error::$f uygulanmadı — sürücü testi anlamsız olurdu"; exit 1; }
          done
          sudo chmod 0777 /var/lib/kadran/volumes

      # KADRAN_E2E_REQUIRE_DOCKER: burada Docker VAR, dolayısıyla test
      # atlamak bir arızadır ve atlama hakkı kaldırılıyor.
      #
      # Bu değişken, ilk koşuda tam olarak gereken şeydi: API sürümü
      # uyuşmazlığı yüzünden bütün testler sessizce atlandı ve adım YEŞİL
      # geçti. Atlanan test ile geçen testi ayırt edemeyen bir kontrol,
      # yeşil rozetten başka bir şey üretmez.
      # ── ROOT olarak koşuyor ve bu ÜRETİME SADAKATTİR ────────────────
      #
      # `kadran-exec` üretimde root çalışıyor. Sürücü, hacim dizinini
      # oluşturup sahibini imajın kullanıcısına devrediyor ve `chown`
      # ayrıcalık ister.
      #
      # Bu adım bir dönem normal runner kullanıcısıyla koşuyordu ve
      # hacim sahipliği eklendiğinde ateşledi:
      #
      #   chown /var/lib/kadran/volumes/e2etest/data: operation not permitted
      #
      # Hata TESTİN kendisindeydi, kodun değil: üretimdeki ayrıcalıkla
      # koşmayan bir E2E, üretimdeki davranışı ölçmüyor. Aynı sınıf bu
      # depoda daha önce de görüldü (Docker'ı olmayan ortamda sessizce
      # SKIP eden testler).
      #
      # `env "PATH=$PATH"`: sudo kendi güvenli PATH'ini kurar ve
      # setup-go'nun kurduğu `go` orada yoktur.
      - name: Docker sürücüsü E2E
        env:
          KADRAN_E2E_REQUIRE_DOCKER: "1"
        run: |
          sudo -E env "PATH=$PATH" \
            go test -tags dockere2e -count=1 -v ./internal/dockerdrv/

      # Testin KENDİSİ sınanıyor: sertleştirme kaldırılınca hacim testi
      # BAŞARISIZ olmalı, sessizce geçmemeli.
      - name: Sertleştirme testi gerçekten ateşliyor mu?
        env:
          KADRAN_E2E_REQUIRE_DOCKER: "1"
        run: |
          sudo umount /var/lib/kadran/volumes
          out="$(go test -tags dockere2e -count=1 -v -run TestVolumeMountIsHardenedEndToEnd ./internal/dockerdrv/ 2>&1)" && rc=0 || rc=1
          echo "$out"
          [[ $rc -ne 0 ]] \
            || { echo "::error::sertleştirme kalkmasına rağmen test GEÇTİ"; exit 1; }
          grep -q "sertleştirilmemiş" <<<"$out" \
            || { echo "::error::test başarısız oldu ama sebebi sertleştirme değil"; exit 1; }

  security:
    name: Güvenlik değişmezleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          go-version: ${{ env.GO_VERSION }}
          buf-version: ${{ env.BUF_VERSION }}

      # Kontrolün KENDİSİ önce sınanıyor: hiç ateşlenmeyen bir güvenlik
      # kontrolü, hiç olmayandan kötüdür — yeşil rozet verir, kimse bakmaz.
      # Bu adım kasten bozulmuş şemalarla kontrolün yakaladığını doğrular.
      - name: Yüzey kontrolünün kendisini sına
        run: bash scripts/check-exec-surface-test.sh

      # Ayrıcalıklı yüzey ne kadar büyürse "en az yetki" o kadar
      # anlamsızlaşır. Şemada temsil EDİLEMEYEN bir seçenek, doğrulanan
      # bir seçenekten güçlüdür: kazara kabul edilemez.
      - name: Ayrıcalıklı yüzey değişmezleri
        run: bash scripts/check-exec-surface.sh

      # Ayrıcalık izolasyonunun ta kendisi: SO_PEERCRED, dosya izinleri
      # tek savunma olmadığı için var. Bu testin kanıtı, izinler KASTEN
      # gevşetildiğinde bile yetkisiz çağıranın reddedilmesi.
      #
      # Önce testin KENDİSİ sınanıyor: executor davetsiz kullanıcıyı kabul
      # edecek şekilde başlatılıp doğrulamanın gerçekten kaldığı görülüyor.
      # Ateşlenmeyen bir güvenlik testi yeşil rozetten başka bir şey
      # üretmez.
      - name: Ayrıcalık izolasyonu (root)
        run: |
          GOOS=linux GOARCH=amd64 go build -o bin/kadran-exec ./cmd/kadran-exec
          GOOS=linux GOARCH=amd64 go build -o bin/kadran-vault ./cmd/kadran-vault
          export KADRAN_EXEC_BIN="$PWD/bin/kadran-exec"
          export KADRAN_VAULT_BIN="$PWD/bin/kadran-vault"

          echo "── 1/2: testin kendisi bozuk politikayı yakalıyor mu?"
          if sudo -E KADRAN_E2E_ALLOW_INTRUDER=1 \
               KADRAN_EXEC_BIN="$KADRAN_EXEC_BIN" KADRAN_VAULT_BIN="$KADRAN_VAULT_BIN" \
               bash scripts/e2e-executor.sh; then
            echo "::error::SO_PEERCRED kasten gevşetildiği hâlde test geçti — test hiçbir şey ölçmüyor." >&2
            exit 1
          fi
          echo "  ✓ test bozuk politikayı yakaladı"

          echo "── 2/2: gerçek doğrulama"
          sudo -E KADRAN_EXEC_BIN="$KADRAN_EXEC_BIN" KADRAN_VAULT_BIN="$KADRAN_VAULT_BIN" \
            bash scripts/e2e-executor.sh

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # ══════════════════════════════════════════════════════════════════
  #  Mutasyon: testlerin GERÇEKTEN bir şey koruduğunu sına
  # ══════════════════════════════════════════════════════════════════
  #
  # Bu iş 17 Eylül'de eklendi ve eklenme sebebi bir boşluktu: sekiz
  # mutasyon betiği aylardır vardı ama HİÇBİRİ CI'da koşmuyordu. Yalnızca
  # elle çalıştırılan bir betik guard değildir — koruduğu değişmez
  # sessizce kırılabilir ve rozet yeşil kalır.
  #
  # ⚠ Betikler TEK TEK sayılmıyor, glob'la bulunuyor. Liste tutmak, yeni
  # bir betiğin unutulmasına davetiye olurdu — tam da bu işi doğuran hata.
  mutation:
    name: Mutasyon (testler gerçekten koruyor mu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          go-version: ${{ env.GO_VERSION }}
          buf-version: ${{ env.BUF_VERSION }}

      # Betikler mutasyonu `python` ile uyguluyor. Ubuntu imajında
      # `python3` garanti, `python` DEĞİL — açıkça kuruluyor.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # mutate-kasa.sh geri dönüş betiğini gerçek sqlite3 ve age ile ölçüyor.
      - name: Kasa geri dönüş araçları
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3 age

      - name: Bütün mutasyon betikleri
        # Sudo kipinin umask mutasyonunu yalnızca gerçek sudo testi
        # yakalıyor (mutate-bootstrapssh.sh, K-127).
        env:
          KADRAN_TEST_REAL_SUDO: "1"
          KADRAN_TEST_REQUIRE_KASA_TOOLS: "1"
        run: |
          set -uo pipefail

          # Boş glob sessizce geçerdi: hiç betik bulunmazsa döngü hiç
          # dönmez ve adım YEŞİL olur — hiçbir şey ölçmeden.
          shopt -s nullglob
          scripts=(scripts/mutate-*.sh)
          echo "bulunan betik: ${#scripts[@]}"
          if [ "${#scripts[@]}" -lt 12 ]; then
            echo "::error::yalnızca ${#scripts[@]} mutasyon betiği bulundu — glob bozuk ya da betikler silinmiş" >&2
            exit 1
          fi

          # ⚠ K-096: DERLEME KAPISI OLMAYAN BETİK ÖLÇMÜYOR.
          #
          # Derlenmeyen bir mutant `go test`'i düşürür; kapısız bir
          # betik bunu "yakalandı" diye okur ve testin iddiası hiç
          # sınanmadan YEŞİL rapor üretir. K-092'de bu gerçekten oldu:
          # `mutate-alarm.sh`'ın kenar tetiklemeyi sınayan EN ÖNEMLİ
          # dört mutasyonu hiçbir şey ölçmüyordu.
          #
          # Kapıları tek tek eklemek yetmez: kapısız eklenen YENİ bir
          # betik sınıfı sessizce geri getirirdi. Varlık burada
          # zorunlu tutuluyor.
          gate_missing=0
          for s in "${scripts[@]}"; do
            if ! grep -q "MUTANT DERLENM" "$s"; then
              echo "::error::$s derleme kapısı taşımıyor — derlenmeyen mutantlar sahte 'yakalandı' üretir (bkz. K-096)" >&2
              gate_missing=1
            fi
            # Tek eşleşme: iğne bir yorumda da geçiyorsa replace(…,1)
            # yorumu değiştirir, kod mutasyonsuz ölçülür (K-127).
            if ! grep -q "KEZ ESLESTI" "$s"; then
              echo "::error::$s tek-eşleşme kapısı taşımıyor — iğne yanlış yeri mutasyona uğratabilir (bkz. K-127)" >&2
              gate_missing=1
            fi
            # Taban: mutasyonsuz kodda düşen test her mutantı
            # "yakalandı" gösterir — SESSİZ sahte geçiş.
            if ! grep -q "TABAN KIRMIZI" "$s"; then
              echo "::error::$s yeşil-taban kapısı taşımıyor — kırmızı taban her mutantı 'yakalandı' gösterir" >&2
              gate_missing=1
            fi
          done
          if [ "$gate_missing" -ne 0 ]; then
            exit 1
          fi

          fail=0
          for s in "${scripts[@]}"; do
            echo "──────────────────────────────────────────"
            echo "▶ $s"
            if ! bash "$s"; then
              echo "::error::$s başarısız — bir mutasyon yakalanmadı" >&2
              fail=1
            fi
          done

          # ⚠ Betikler kaynağı `trap restore EXIT` ile geri yüklüyor.
          # Bozuk bir restore, SONRAKİ betiğin ölçümünü sessizce
          # geçersiz kılardı: mutasyona uğramış bir dosyanın üstüne
          # ikinci mutasyon uygulanır ve sonuç yorumlanamaz hâle gelir.
          # Ağacın temiz döndüğü ayrıca kanıtlanıyor.
          if ! git diff --exit-code; then
            echo "::error::mutasyon betikleri kaynağı geri yükleyemedi — yukarıdaki ölçümler GÜVENİLMEZ" >&2
            exit 1
          fi

          exit "$fail"
