name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Üretilen protobuf kodu depoya konmuyor (.gitignore: *.pb.go), bu yüzden
# HER iş önce `buf generate` çalıştırmak zorunda. Ortak adımlar bir bileşik
# eyleme (.github/actions/setup) çıkarıldı.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"
  BUF_VERSION: "1.47.2"

jobs:
  lint:
    name: Biçim ve statik analiz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          go-version: ${{ env.GO_VERSION }}
          buf-version: ${{ env.BUF_VERSION }}

      - name: buf lint
        run: buf lint

      - name: gofmt
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [[ -n "$unformatted" ]]; then
            echo "Biçimlendirilmemiş dosyalar:" >&2
            echo "$unformatted" >&2
            echo "Düzeltmek için: gofmt -w ./cmd ./internal" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # # Sürüm sabiti neden hem action'ı hem linter'ı kapsıyor?
      #
      # action v6 YALNIZCA golangci-lint v1, v7+ YALNIZCA v2 destekliyor.
      # Yani linter sürümünü değiştirmek action'ın ana sürümünü de
      # değiştirmek demek; ikisi birlikte hareket etmek zorunda.
      # .golangci.yml de v2 şemasında — üçü tek bir küme.
      #
      # v1.62 neden bırakıldı: yayınlanmış binary'si go1.23 ile derlenmiş
      # ve golangci-lint kendi Go sürümünü go.mod'un hedefinden (1.25.0)
      # küçük bulunca yapılandırmayı okumadan çıkıyor. Yerelde sorun
      # görünmüyordu çünkü yerel kurulum `go install` ile, yani yerel
      # araç zinciriyle derlenmişti. v2.12.2'nin linux-amd64 artefaktının
      # go1.26.2 ile derlendiği indirilip doğrulandı.
      #
      # Bu adım setup'tan SONRA gelmek zorunda: üretilen protobuf kodu
      # olmadan tip denetimi yapılamaz ve linter anlamsız hatalar verir.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  test:
    name: Testler (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux üretim hedefi; Windows geliştirme iş istasyonu. İkisi de
        # kırılmamalı — güvenlik testlerinin bir kısmı yalnızca Linux'ta
        # KOŞUYOR (SO_PEERCRED, unix soketi), ama hepsi ikisinde de DERLENİYOR.
        #
        # ubuntu-24.04-arm GERÇEK arm64 donanımıdır ve emülasyon değildir.
        #
        # Neden önemli: arm64 uzun süre yalnızca ÇAPRAZ DERLENİYORDU, hiç
        # KOŞTURULMUYORDU. "Derleniyor" ile "çalışıyor" arasındaki fark,
        # bu projede tekrar tekrar gerçek hata çıkardı — SO_PEERCRED
        # testleri de Windows'ta derlenip koşmadığı için bir dönem boşluk
        # bırakmıştı. Hizalama, atomik işlemler ve syscall davranışı
        # mimariye göre değişir; derleyici bunları yakalamaz.
        #
        # Bu runner PUBLIC depolarda ücretsiz. Hetzner'de ARM (cax*)
        # kapasitesi nbg1/fsn1/hel1'in üçünde de yoktu, yani gerçek ARM'a
        # erişimin tek yolu buydu (docs/decisions.md K-037).
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          go-version: ${{ env.GO_VERSION }}
          buf-version: ${{ env.BUF_VERSION }}

      - name: go test -race
        run: go test -race -count=1 ./...

  build:
    name: Derleme (linux/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          go-version: ${{ env.GO_VERSION }}
          buf-version: ${{ env.BUF_VERSION }}

      # arm64 desteği iddia değil, gereklilik: Hetzner'ın ARM sunucuları
      # (CAX serisi) belirgin biçimde ucuz. SQLite sürücüsü CGO'suz
      # (modernc.org/sqlite) seçildiği için çapraz derleme sade kalıyor.
      - name: Binary'leri derle
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME}"
          ldflags="-s -w"
          ldflags="$ldflags -X github.com/erkanrzgc/panely/internal/version.Version=$version"
          ldflags="$ldflags -X github.com/erkanrzgc/panely/internal/version.Commit=${GITHUB_SHA::12}"
          for binary in panelyd panely-exec panely-connect panely; do
            go build -trimpath -ldflags "$ldflags" -o "dist/$binary" "./cmd/$binary"
          done
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: panely-linux-${{ matrix.arch }}
          path: dist/
          retention-days: 14

  e2e:
    name: Uçtan uca (gerçek panelyd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          go-version: ${{ env.GO_VERSION }}
          buf-version: ${{ env.BUF_VERSION }}

      # Birim testleri istemciyi SAHTE bir sunucuya karşı sınıyor. Sahte
      # sunucu SO_PEERCRED doğrulaması yapmıyor ve kimlik önsözünü okumuyor;
      # K-012'deki hata tam olarak bu boşlukta yaşadı. Burada gerçek panelyd
      # başlatılıp gerçek panely ile konuşuluyor.
      - name: Binary'leri derle
        run: |
          mkdir -p bin/linux
          go build -o bin/linux/panelyd ./cmd/panelyd
          go build -o bin/linux/panely ./cmd/panely

      - name: E2E CLI kontrolleri
        run: bash scripts/e2e-cli-runner.sh bin/linux

      # ── Docker sürücüsü GERÇEK daemon'a karşı ──────────────────────
      #
      # Birim testleri SAHTE bir daemon'a konuşuyor ve sahte daemon,
      # gövdeyi Docker'ın gerçekten kabul edip etmediğini bilmez. Bu
      # projede "derleniyor" ile "çalışıyor" farkı defalarca gerçek hata
      # çıkardı; ubuntu runner'ında Docker zaten kurulu, bedava.
      #
      # Hacim kökü BURADA sertleştiriliyor, çünkü sertleştirilmemişse
      # ilgili test SKIP eder — ve sessizce atlanan bir güvenlik testi
      # yeşil rozetten başka bir şey üretmez.
      - name: Hacim kökünü sertleştir (nodev,nosuid)
        run: |
          sudo mkdir -p /var/lib/panely/volumes
          sudo mount -o bind,nodev,nosuid /var/lib/panely/volumes /var/lib/panely/volumes
          opts="$(awk '$5=="/var/lib/panely/volumes"{print $6}' /proc/self/mountinfo | head -1)"
          echo "etkin: $opts"
          for f in nodev nosuid; do
            printf '%s' "$opts" | tr ',' '\n' | grep -qx "$f" \
              || { echo "::error::$f uygulanmadı — sürücü testi anlamsız olurdu"; exit 1; }
          done
          sudo chmod 0777 /var/lib/panely/volumes

      - name: Docker sürücüsü E2E
        run: go test -tags dockere2e -count=1 -v ./internal/dockerdrv/

      # Testin KENDİSİ sınanıyor: sertleştirme kaldırılınca hacim testi
      # SKIP'e düşmeli, sessizce GEÇMEMELİ. Atlanan test ile geçen testi
      # ayırt edemeyen bir kontrol, hiç olmayandan kötüdür.
      - name: Sertleştirme testi gerçekten ateşliyor mu?
        run: |
          sudo umount /var/lib/panely/volumes
          out="$(go test -tags dockere2e -count=1 -v -run TestVolumeMountIsHardenedEndToEnd ./internal/dockerdrv/ 2>&1)"
          echo "$out"
          grep -q "sertleştirilmemiş" <<<"$out" \
            || { echo "::error::sertleştirme kalkmasına rağmen test bunu fark etmedi"; exit 1; }

  security:
    name: Güvenlik değişmezleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          go-version: ${{ env.GO_VERSION }}
          buf-version: ${{ env.BUF_VERSION }}

      # Kontrolün KENDİSİ önce sınanıyor: hiç ateşlenmeyen bir güvenlik
      # kontrolü, hiç olmayandan kötüdür — yeşil rozet verir, kimse bakmaz.
      # Bu adım kasten bozulmuş şemalarla kontrolün yakaladığını doğrular.
      - name: Yüzey kontrolünün kendisini sına
        run: bash scripts/check-exec-surface-test.sh

      # Ayrıcalıklı yüzey ne kadar büyürse "en az yetki" o kadar
      # anlamsızlaşır. Şemada temsil EDİLEMEYEN bir seçenek, doğrulanan
      # bir seçenekten güçlüdür: kazara kabul edilemez.
      - name: Ayrıcalıklı yüzey değişmezleri
        run: bash scripts/check-exec-surface.sh

      # Ayrıcalık izolasyonunun ta kendisi: SO_PEERCRED, dosya izinleri
      # tek savunma olmadığı için var. Bu testin kanıtı, izinler KASTEN
      # gevşetildiğinde bile yetkisiz çağıranın reddedilmesi.
      #
      # Önce testin KENDİSİ sınanıyor: executor davetsiz kullanıcıyı kabul
      # edecek şekilde başlatılıp doğrulamanın gerçekten kaldığı görülüyor.
      # Ateşlenmeyen bir güvenlik testi yeşil rozetten başka bir şey
      # üretmez.
      - name: Ayrıcalık izolasyonu (root)
        run: |
          GOOS=linux GOARCH=amd64 go build -o bin/panely-exec ./cmd/panely-exec
          export PANELY_EXEC_BIN="$PWD/bin/panely-exec"

          echo "── 1/2: testin kendisi bozuk politikayı yakalıyor mu?"
          if sudo -E PANELY_E2E_ALLOW_INTRUDER=1 \
               PANELY_EXEC_BIN="$PANELY_EXEC_BIN" bash scripts/e2e-executor.sh; then
            echo "::error::SO_PEERCRED kasten gevşetildiği hâlde test geçti — test hiçbir şey ölçmüyor." >&2
            exit 1
          fi
          echo "  ✓ test bozuk politikayı yakaladı"

          echo "── 2/2: gerçek doğrulama"
          sudo -E PANELY_EXEC_BIN="$PANELY_EXEC_BIN" bash scripts/e2e-executor.sh

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
