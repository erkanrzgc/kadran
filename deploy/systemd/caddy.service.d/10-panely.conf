# Panely'nin Caddy birimine eklediği ayarlar (drop-in).
#
# Dağıtımın kendi caddy.service'i olduğu gibi bırakılıyor; yalnızca
# çalıştırılan binary ve yapılandırma değiştiriliyor. Birimin tamamını
# kopyalamak, dağıtım paketi güncellendiğinde sessizce eskiyen bir kopya
# bırakırdı.

[Unit]
# Admin soketi Caddy'den ÖNCE hazır olmalı: Caddy onu fd/3 olarak
# devralıyor ve soket yoksa "getsockopt: socket operation on non-socket"
# ile ölüyor (ölçüldü).
Requires=caddy-admin.socket
After=caddy-admin.socket

[Service]
# ── Stok Caddy DEĞİL: panely-caddy ──────────────────────────────────
#
# Dosya servis eden modüller (file_server, templates) bu binary'de HİÇ
# YOK. Gerekçe build/caddy/main.go'da ayrıntılı; özeti: panelyd admin
# soketine yazabildiği için, stok Caddy'de o yetki "alan adının TLS özel
# anahtarını okuyabilme"yi de kapsıyordu. Ölçüldü, varsayılmadı.
ExecStart=
ExecStart=/usr/local/lib/panely/panely-caddy run --config /etc/caddy/config.json

ExecReload=
ExecReload=/usr/local/lib/panely/panely-caddy reload --config /etc/caddy/config.json --force

# ⚠ Group= DEĞİŞTİRİLMEMELİ.
#
# Caddy `panely` grubuna girerse /run/panely-exec/exec.sock'a (0660
# root:panely) ulaşabilir; yani ters vekil, ayrıcalıklı executor'a
# konuşabilir hâle gelir. panelyd'nin admin soketine erişimi grup
# ÜYELİĞİYLE değil, soketin GRUP SAHİPLİĞİYLE sağlanıyor
# (bkz. caddy-admin.socket).
