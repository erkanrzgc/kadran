# /etc/tmpfiles.d/panely.conf
#
# Çalışma zamanı dizinleri, sahiplikleri kesin olacak şekilde burada
# oluşturulur. Unit dosyalarındaki RuntimeDirectory= kullanılmaz, çünkü
# systemd o dizini unit'in User=/Group= değerine göre sahiplendirir ve
# bize iki farklı grup lazım.
#
#   /run/panely       → panelyd api.sock'u buraya koyar,
#                       panely-client grubu erişir
#   /run/panely-exec  → executor exec.sock'u buraya koyar,
#                       YALNIZCA panely grubu (yani panelyd) erişir
#
# Kritik olan: istemci SSH kullanıcısı panely-client grubundadır,
# panely grubunda DEĞİLDİR. Bu yüzden /run/panely-exec (0750 root:panely)
# dizinini traverse edemez ve executor'a doğrudan bağlanamaz.

d /run/panely       0750 panely panely-client -
d /run/panely-exec  0750 root   panely        -

# Kalıcı durum: SQLite veritabanı ve hacimler.
d /var/lib/panely             0750 panely panely -
d /var/lib/panely/volumes     0751 root   panely -

# Executor denetim günlüğü — daemon'un dizininde DEĞİL (K-100, K-102).
#
# Günlük eskiden /var/lib/panely içindeydi. Dosya root:panely 0640'tı,
# yani daemon içeriğine yazamıyordu — ama DİZİN daemon'undu ve bir
# dizine yazma yetkisi, içindeki dosyayı silme ve yerine başkasını
# koyma yetkisidir. Ele geçirilen bir panelyd, ayrıcalıklı tarafın
# kaydını kendi zinciriyle değiştirebilirdi.
#
# 0700 root: günlüğü yalnızca executor okur; `panely audit` onu RPC ile
# executor'dan alır, dosyadan değil.
d /var/lib/panely-exec        0700 root   root   -
