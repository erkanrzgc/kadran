syntax = "proto3";

package panely.v1;

import "google/protobuf/timestamp.proto";
import "panely/v1/common.proto";

option go_package = "github.com/erkanrzgc/panely/internal/pb/panely/v1;panelyv1";

// PanelyService, iş istasyonu istemcisi (CLI / Electron sidecar) ile
// sunucudaki panelyd arasındaki sözleşmedir.
//
// Taşıma: `/run/panely/api.sock` üzerinde gRPC. Uzaktan erişim SSH
// zorlanmış komutu (panely-connect) üzerinden bu sokete yönlendirilir.
// Ağ dinleyicisi yoktur.
//
// Kimlik doğrulama SSH katmanında yapılır; buraya ulaşan her istek
// halihazırda doğrulanmıştır.
//
// Çağıranın kimliği gRPC METADATA'SINDAN OKUNMAZ. panely-connect bir bayt
// pompasıdır: metadata'yı yazan o değil, SSH'ın diğer ucundaki uzak
// istemcidir; yani istemci kendi parmak izini uydurabilirdi. Kimlik bunun
// yerine bağlantı önsözünden gelir — panely-connect onu, sshd'nin kendi
// ortam değişkenlerinden türeterek, uzak istemciden tek bayt okumadan
// yazar (bkz. internal/connproto).
//
// Yerel bağlantılarda önsözü istemcinin kendisi yazar ve kimliksiz
// ("origin: local") olarak işaretler.
service PanelyService {
  // Ping, bağlantı canlılığını ve sürüm uyumunu doğrular.
  rpc Ping(PingRequest) returns (PingResponse);

  // GetSystemInfo, daemon ve host durumunu döner.
  rpc GetSystemInfo(GetSystemInfoRequest) returns (GetSystemInfoResponse);

  // ListAuditRecords, denetim zincirini sayfalı olarak okur.
  rpc ListAuditRecords(ListAuditRecordsRequest) returns (ListAuditRecordsResponse);

  // VerifyAuditChain, zincirin tamamını yürür ve kurcalama tespit eder.
  // Hem daemon hem executor zincirini doğrular ve ikisini karşılaştırır.
  rpc VerifyAuditChain(VerifyAuditChainRequest) returns (VerifyAuditChainResponse);

  // ── Uygulamalar ────────────────────────────────────────────────────

  // CreateApp, yeni bir uygulama tanımı kaydeder. Hiçbir şey derlemez
  // veya çalıştırmaz; yalnızca kontrol düzlemi durumunu yazar.
  rpc CreateApp(CreateAppRequest) returns (CreateAppResponse);

  // UpdateApp, var olan bir uygulamanın DEĞİŞTİRİLEBİLİR alanlarını yazar.
  //
  // Alan adı değişirse ters vekil aynı çağrıda yeniden uzlaştırılır —
  // yani trafik dağıtım beklemeden taşınır. Diğer alanlar bir sonraki
  // dağıtımda etkili olur; hangisinin ne zaman etkili olduğu
  // UpdateAppRequest'te alan alan yazılı.
  rpc UpdateApp(UpdateAppRequest) returns (UpdateAppResponse);

  // ListApps, tanımlı uygulamaları döner.
  rpc ListApps(ListAppsRequest) returns (ListAppsResponse);

  // GetApp, tek bir uygulamayı ve sürüm geçmişini döner.
  rpc GetApp(GetAppRequest) returns (GetAppResponse);

  // Deploy, bir commit'i derler, konteynerleri ayağa kaldırır ve sağlık
  // kapısı geçilirse trafiği ona çevirir (blue-green).
  //
  // Sıra YÜK TAŞIYOR: kapı → aktif sürüm yazılır → ters vekil yüklenir →
  // boşaltma penceresi → eski konteynerler durdurulur. Ayrıntı ve
  // gerekçeler internal/deploy/rollout.go'da.
  rpc Deploy(DeployRequest) returns (stream DeployResponse);
}

// DeleteApp KASTEN YOK.
//
// Uygulama silmek geri alınamaz bir işlemdir ve şartname §1.3 bu sınıfı
// TOTP onay kapısının arkasına koyar. Kapı Faz 2'de geliyor. Silmeyi
// şimdi eklemek, kapısı olmayan bir yıkıcı işlem bırakırdı — sonradan
// kapı eklemek, var olan bir RPC'yi kısıtlamak demektir ve kısıtlanan
// arayüzler geriye dönük uyumsuzdur. Yokluğu bir eksik değil, sıralama
// kararıdır.

message PingRequest {
  // İstemcinin sürümü. Sunucu uyumsuzluk durumunda uyarı döner.
  string client_version = 1;
}

message PingResponse {
  string daemon_version = 1;
  // Sözleşme sürümü. Uyumsuzsa istemci bağlanmayı reddeder.
  uint32 protocol_version = 2;
  google.protobuf.Timestamp server_time = 3;
  // Boş değilse istemciye gösterilecek uyumluluk uyarısı.
  string compatibility_warning = 4;
}

message GetSystemInfoRequest {}

message GetSystemInfoResponse {
  string daemon_version = 1;
  string hostname = 2;
  // Daemon'ın çalışma süresi, saniye.
  int64 daemon_uptime_seconds = 3;
  // panelyd'nin çalıştığı kullanıcı adı. "root" olmamalıdır.
  string running_as_user = 4;
  // Executor'a ulaşılabiliyor mu?
  bool executor_reachable = 5;
  string executor_version = 6;
  HostInfo host = 7;
}

message ListAuditRecordsRequest {
  // Bu sıra numarasından itibaren okur (dahil). 0 = baştan.
  uint64 after_seq = 1;
  // Döndürülecek en fazla kayıt. 0 = varsayılan (100), üst sınır 1000.
  uint32 limit = 2;
}

message ListAuditRecordsResponse {
  repeated AuditRecord records = 1;
  // Zincirdeki en son sıra numarası.
  uint64 latest_seq = 2;
}

message VerifyAuditChainRequest {}

// ChainStatus, bir denetim zincirinin doğrulama sonucudur.
//
// "Doğrulanamadı" ile "geçersiz" AYRI durumlardır ve tek bir bool'a
// sıkıştırılamaz:
//
//   - UNREACHABLE bir işletim sorunudur: executor kapalı, veritabanı
//     okunamıyor. Zincir hakkında hiçbir şey söylemez.
//   - INVALID kurcalama şüphesidir ve araştırılması gerekir.
//
// İkisini aynı kutuya koymak, executor'ın kapalı olduğu her an operatörü
// olmayan bir saldırının peşine düşürürdü.
enum ChainStatus {
  CHAIN_STATUS_UNSPECIFIED = 0;
  CHAIN_STATUS_VALID = 1;
  CHAIN_STATUS_INVALID = 2;
  CHAIN_STATUS_UNREACHABLE = 3;
}

message VerifyAuditChainResponse {
  // 1 ve 5, üç durumlu bir sonucu bool ile temsil ettikleri için
  // kaldırıldı; yerlerine daemon_status / executor_status geldi.
  reserved 1, 5;
  reserved "valid", "executor_chain_valid";

  ChainStatus daemon_status = 7;
  uint64 records_checked = 2;
  // Zincir INVALID ise ilk bozulan sıra numarası; aksi hâlde 0.
  uint64 first_invalid_seq = 3;
  string detail = 4;

  // Executor kendi günlüğünü ayrı tutar; panelyd o dosyaya yazamaz.
  // İki zincir ayrı raporlanır — tek bir "geçerli" satırında birleştirmek,
  // modelin tamamının dayandığı ayrımı gizlerdi.
  ChainStatus executor_status = 8;
  uint64 executor_records_checked = 9;
  string executor_detail = 6;
}

// ════════════════════════════════════════════════════════════════════
//  UYGULAMA MODELİ
// ════════════════════════════════════════════════════════════════════

// AppSpec, bir uygulamanın kullanıcı tarafından belirlenen tanımıdır.
//
// ── Neden GitSource (exec.proto) yeniden kullanılmıyor? ─────────────
//
// GitSource `commit_sha` taşır; AppSpec `git_branch` taşır. Bu fark
// tesadüf değil, modelin kendisi:
//
//   uygulama → bir DALA bakar (hareket eder)
//   sürüm    → bir COMMIT'tir (donmuştur)
//
// Aynı mesajı ikisine de zorlamak, ya uygulamaya anlamsız bir sha ya da
// sürüme hareketli bir dal alanı verirdi. Executor'a giden GitSource,
// AppSpec + çözülmüş sha'dan daemon tarafında KURULUR.
//
// ── Dalı commit'e kim çözer? İSTEMCİ ────────────────────────────────
//
// panelyd çözemez. Birim dilim 4c'de sağlık yoklaması için AF_INET aldı,
// ama `IPAddressDeny=any` + `IPAddressAllow=172.16.0.0/12` yalnızca
// Docker'ın özel ağına izin veriyor — `git ls-remote` de HTTPS de hâlâ
// mümkün değil. Gerçek sunucuda ölçüldü: panelyd'nin cgroup'undan
// 1.1.1.1'e bağlanma denemesi engelleniyor, aynı deneme cgroup dışında
// başarılı oluyor.
//
// Bu bir eksiklik değil, en-az-yetkinin ölçülebilir hâli: kontrol düzlemi
// süreci internete çıkmaz.
//
// Dolayısıyla Deploy TAM 40 haneli bir sha alır ve çözümü iş
// istasyonundaki istemci yapar. Faz 4'ün webhook akışı da bunu bozmaz:
// GitHub'ın yükü zaten commit sha'sını taşır.
message AppSpec {
  // ^[a-z][a-z0-9-]{0,31}$ — executor'ın app_id kısıtıyla aynı.
  string app_id = 1;

  // Kaynak depo. Host, executor'ın `-allow-git-host` beyaz listesinde
  // OLMALIDIR; daemon bunu bilmez ve bilmemelidir (liste bir işletme
  // kararıdır ve ele geçirilmiş bir panelyd ona ekleme yapamamalıdır).
  string git_host = 2;
  string git_owner = 3;
  string git_repo = 4;
  // Varsayılan dal. Yalnızca istemcinin sha çözümü için bir ipucudur;
  // sunucu tarafında hiçbir yere geçirilmez.
  string git_branch = 5;

  // Depo köküne göreli. Boşsa "Dockerfile".
  string dockerfile_path = 6;

  // ⚠ Derleme argümanlarının DEĞERLERİ `docker history` çıktısında düz
  // metin görünür — bu ölçüldü, varsayım değil. Sır TAŞIMAMALIDIR.
  // Denetim kaydına yalnızca ADLARI yazılır.
  map<string, string> build_args = 7;

  // Uygulamanın konteyner içinde dinlediği port. Host'a yayınlanmaz.
  uint32 container_port = 8;

  // Çalıştırılacak replika sayısı.
  uint32 replicas = 9;

  // Sağlık yoklaması yolu ("/healthz"). Dilim 4b'de kullanılacak.
  string health_path = 10;

  // Uygulamanın yayınlanacağı alan adı. Dilim 4b'de Caddy'ye geçecek;
  // şimdi yalnızca saklanıyor.
  string domain = 11;

  // Sıfır değer KABUL EDİLMEZ — limitsiz konteyner yoktur.
  ResourceLimits limits = 12;
}

// App, AppSpec artı sunucu tarafından üretilen alanlar.
message App {
  AppSpec spec = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp updated_at = 3;
  // Şimdiye kadar üretilmiş sürüm sayısı. Sıradaki sürümün adı bundan
  // türetilir ("r" + (count+1)).
  uint32 release_count = 4;
}

// ReleaseStatus, bir sürümün yaşam döngüsündeki yeridir.
//
// Bool DEĞİL: "derleniyor" ile "derlenemedi" farklı durumlar ve ikisi de
// "çalışmıyor". Tek bir bayrağa sıkıştırmak, yarıda kalmış bir derlemeyi
// başarısız bir derlemeden ayırt edilemez yapardı.
enum ReleaseStatus {
  RELEASE_STATUS_UNSPECIFIED = 0;
  // Sürüm kaydedildi, derleme sürüyor.
  RELEASE_STATUS_BUILDING = 1;
  // İmaj üretildi ve kimliği (aux karesi) kaydedildi.
  RELEASE_STATUS_BUILT = 2;
  // Derleme başarısız. detail sebebi taşır.
  RELEASE_STATUS_FAILED = 3;
}

message Release {
  string release_id = 1;
  string app_id = 2;
  // TAM 40 haneli küçük harf onaltılık.
  string commit_sha = 3;
  ReleaseStatus status = 4;
  // Docker'ın aux karesinden gelen imaj kimliği ("sha256:...").
  //
  // ⚠ BOŞ ise başarı İDDİA EDİLEMEZ. Docker klasik derleyicisi, derleme
  // ortasında ölen bir yapı için de HTTP 200 döner; başarının tek pozitif
  // kanıtı bu alandır (docs/decisions.md K-042).
  string image_id = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp finished_at = 7;
  string detail = 8;
}

message CreateAppRequest {
  AppSpec spec = 1;
}

message CreateAppResponse {
  App app = 1;
}

// UpdateAppRequest, bir uygulamanın değiştirilebilir alanlarını taşır.
//
// ── Neden `optional`, neden tam AppSpec değil? ──────────────────────
//
// Boş dize hem `domain` hem `health_path` için GEÇERLİ bir değer
// ("ters vekilde görünme", "HTTP yoklaması yapma"). Tam bir AppSpec
// gönderme modelinde, alanı doldurmayan bir istemci onları SESSİZCE
// silerdi — ve bu iki alan tam olarak bu işin var olma sebebi.
// `replicas` aynı hataya düşse doğrulayıcıya çarpıp gürültülü ölürdü.
//
// proto3 `optional` alanı işaretçiye çeviriyor, yani "belirtilmedi" ile
// "boşa ayarla" TEMSİL EDİLEBİLİR biçimde ayrışıyor. Bu şemanın her
// yerinde tekrarlanan tercih: doğrulanan bir kural yerine temsil
// edilemeyen bir durum.
//
// ── Hangi alan NE ZAMAN etkili olur? ────────────────────────────────
//
// Her biri ölçüldü, varsayılmadı:
//
//   domain      → BU ÇAĞRIDA. Rota `apps.domain`'den JOIN'le üretiliyor
//                 (store/deployments.go) ve daemon uzlaştırmayı hemen
//                 koşturuyor.
//   replicas    → bir sonraki dağıtımda. Uzlaştırıcı konteyner yaratmaz;
//                 replika sayısını yalnızca rollout okur.
//   health_path → bir sonraki dağıtımda. Sağlık kapısı yoklamayı orada
//                 yapar.
//   git_branch  → istemcinin bir sonraki sha çözümünde. Sunucu bu alanı
//                 hiçbir yere geçirmez.
//
// ── container_port KASTEN YOK ───────────────────────────────────────
//
// store.Deployment portu `apps`'ten CANLI okuyor. Değiştirmek, bir
// sonraki uzlaştırmada ters vekili çalışan konteynerlerin DİNLEMEDİĞİ
// bir porta yönlendirir ve siteyi anında düşürür. Port değişikliği yeni
// bir dağıtım gerektirir; dağıtımsız temsil edilebilir olması tuzaktı.
//
// Git kaynağı (host/owner/repo) da yok: deponun değişmesi bir güncelleme
// değil, başka bir uygulamadır.
message UpdateAppRequest {
  string app_id = 1;

  optional string domain = 2;
  optional string git_branch = 3;
  optional string health_path = 4;
  optional uint32 replicas = 5;
}

message UpdateAppResponse {
  App app = 1;

  // Ters vekilin durumu. BOŞ ise uzlaştırma hiç gerekmedi (alan adı
  // değişmedi).
  //
  // Ayrı bir alan olması gerekli: alan adı değişip de trafiğin
  // taşınmaması MÜMKÜN — uygulamanın ayakta replikası yoksa uzlaştırıcı
  // onu atlar. Bu bir hata değil (henüz dağıtılmamış bir uygulama için
  // normal), ama kullanıcının bunu bilmesi şart. Yalnızca "tamam"
  // demek, yeni alan adının canlıda cevap verdiğini ima ederdi.
  string proxy_detail = 2;
}

message ListAppsRequest {}

message ListAppsResponse {
  repeated App apps = 1;
}

message GetAppRequest {
  string app_id = 1;
  // Döndürülecek en fazla sürüm (en yeniden eskiye). 0 = varsayılan 20.
  uint32 release_limit = 2;
}

message GetAppResponse {
  App app = 1;
  repeated Release releases = 2;
}

message DeployRequest {
  string app_id = 1;

  // TAM 40 haneli küçük harf onaltılık. Dal veya etiket adı KABUL
  // EDİLMEZ — bkz. AppSpec'teki "dalı kim çözer" notu ve exec.proto'daki
  // GitSource.commit_sha gerekçesi (tekrarlanabilirlik + fragment kaçışı).
  string commit_sha = 2;
}

// DeployResponse, dağıtım akışının tek bir olayıdır.
//
// ── Neden oneof, neden ayrı bir "başarıldı" mesajı? ─────────────────
//
// K-042: Docker'ın klasik derleyicisinde başarının ölçütü POZİTİF bir
// `aux` karesidir, "hata karesi görmedim" değil. Akışı istemciye taşımak
// bu ölçütü KENDİLİĞİNDEN taşımaz: yalnızca günlük baytları iletilseydi,
// istemci derleme ortasında ölen bir yapıyı başarılı olandan ayırt
// edemezdi (ikisi de "biraz çıktı, sonra akış bitti" gibi görünür).
//
// Bu yüzden aynı ölçüt bir katman yukarıda TEKRARLANIYOR:
//
//   başarı  = akışın SON mesajı DeploySucceeded'dır
//   hata    = gRPC hata durumu (detail ile)
//
// DeploySucceeded görmeden biten bir akış BAŞARISIZDIR. Bu, "olumsuzun
// yokluğu"na değil olumlunun varlığına dayanır ve istemci tarafında da
// aynı şekilde iddia edilebilir.
message DeployResponse {
  oneof event {
    // İlk mesaj, tam bir kez. Sürüm kaydı derleme BAŞLAMADAN yazılır;
    // böylece istemci düşse bile sürüm veritabanında adreslenebilir.
    DeployAccepted accepted = 1;

    // Derleyicinin ham çıktısı. Sırasıyla akar.
    BuildOutput output = 2;

    // Son mesaj, YALNIZCA başarıda.
    DeploySucceeded succeeded = 3;
  }
}

message DeployAccepted {
  string release_id = 1;
  string app_id = 2;
  string commit_sha = 3;
}

message BuildOutput {
  bytes data = 1;
  // Docker akış çerçevelemesinden gelir (bayt 0: 01=stdout, 02=stderr).
  // Derleyicinin hata karesi de buradan, stderr olarak geçer.
  bool is_stderr = 2;
}

message DeploySucceeded {
  string release_id = 1;
  // Boş OLAMAZ. Boşsa sunucu bu mesajı hiç göndermez, hata döner.
  string image_id = 2;
}
