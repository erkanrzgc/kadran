# /etc/tmpfiles.d/kadran.conf
#
# Çalışma zamanı dizinleri, sahiplikleri kesin olacak şekilde burada
# oluşturulur. Unit dosyalarındaki RuntimeDirectory= kullanılmaz, çünkü
# systemd o dizini unit'in User=/Group= değerine göre sahiplendirir ve
# bize iki farklı grup lazım.
#
#   /run/kadran       → kadrand api.sock'u buraya koyar,
#                       kadran-client grubu erişir
#   /run/kadran-exec  → executor exec.sock'u buraya koyar,
#                       YALNIZCA kadran grubu (yani kadrand) erişir
#
# Kritik olan: istemci SSH kullanıcısı kadran-client grubundadır,
# kadran grubunda DEĞİLDİR. Bu yüzden /run/kadran-exec (0750 root:kadran)
# dizinini traverse edemez ve executor'a doğrudan bağlanamaz.

d /run/kadran       0750 kadran kadran-client -
d /run/kadran-exec  0750 root   kadran        -

# Kalıcı durum: SQLite veritabanı ve hacimler.
d /var/lib/kadran             0750 kadran kadran -
d /var/lib/kadran/volumes     0751 root   kadran -

# Executor denetim günlüğü — daemon'un dizininde DEĞİL (K-100, K-102).
#
# Günlük eskiden /var/lib/kadran içindeydi. Dosya root:kadran 0640'tı,
# yani daemon içeriğine yazamıyordu — ama DİZİN daemon'undu ve bir
# dizine yazma yetkisi, içindeki dosyayı silme ve yerine başkasını
# koyma yetkisidir. Ele geçirilen bir kadrand, ayrıcalıklı tarafın
# kaydını kendi zinciriyle değiştirebilirdi.
#
# 0700 root: günlüğü yalnızca executor okur; `kadran audit` onu RPC ile
# executor'dan alır, dosyadan değil.
d /var/lib/kadran-exec        0700 root   root   -
