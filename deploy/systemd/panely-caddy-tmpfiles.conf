# /run/panely-caddy — admin soketinin durduğu dizin.
#
# Sahip panely-caddy (soketi o kullanır), grup panely (panelyd oraya
# bağlanır), mod 0750: başka hiç kimse dizini traverse edemez.
#
# ⚠ Bu satır panely-caddy'yi panely grubunun ÜYESİ YAPMAZ; yalnızca
# dizinin grup sahipliğini belirler. Fark kritik — üyelik verilseydi ters
# vekil /run/panely-exec/exec.sock'a (0660 root:panely) ulaşabilirdi.
#
# systemd-tmpfiles bunu her açılışta yeniden kurar; /run bir tmpfs'tir ve
# yeniden başlatmayı geçmez. Soketin KENDİ izinlerini
# panely-caddy-admin.socket belirliyor (SocketUser/SocketGroup/SocketMode).
d /run/panely-caddy 0750 panely-caddy panely -
