# /run/kadran-caddy — admin soketinin durduğu dizin.
#
# Sahip kadran-caddy (soketi o kullanır), grup kadran (kadrand oraya
# bağlanır), mod 0750: başka hiç kimse dizini traverse edemez.
#
# ⚠ Bu satır kadran-caddy'yi kadran grubunun ÜYESİ YAPMAZ; yalnızca
# dizinin grup sahipliğini belirler. Fark kritik — üyelik verilseydi ters
# vekil /run/kadran-exec/exec.sock'a (0660 root:kadran) ulaşabilirdi.
#
# systemd-tmpfiles bunu her açılışta yeniden kurar; /run bir tmpfs'tir ve
# yeniden başlatmayı geçmez. Soketin KENDİ izinlerini
# kadran-caddy-admin.socket belirliyor (SocketUser/SocketGroup/SocketMode).
d /run/kadran-caddy 0750 kadran-caddy kadran -
